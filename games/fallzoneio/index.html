
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FallZone.io - BIGTOE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #game {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #status {
      position: fixed;
      top: 50%;
      width: 100%;
      text-align: center;
      color: white;
      font: 18px Arial, sans-serif;
      z-index: 10;
    }
  </style>
</head>

<body>
  <div id="status">Loading FallZone...</div>
  <canvas id="game"></canvas>

  <!-- Temporary fix for missing cursor function -->
  <script>
    window.setCursor = function(value) {
      console.log("Unity requested cursor:", value);
    };
  </script>

  <!-- Unity WebGL loader -->
  <script src="build/bca790120e83811a2377d59719115759.loader.js"></script>

  <script>
    const build = "build/";
    const status = document.querySelector("#status");

    createUnityInstance(document.querySelector("#game"), {
      dataUrl: build + "f2922761fd2fc4437369dc8dd2a9274d.data",
      frameworkUrl: build + "7b342f6ca512dd39aacd92ce9bf9507a.framework.js",
      codeUrl: build + "b0d8401e13ec7bae29e4044e1a9b3fc5.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Unity",
      productName: "FallZone",
      productVersion: "1.0"
    }, progress => {
      status.textContent =
        "Loading FallZone... " + Math.round(progress * 100) + "%";
    }).then(() => {
      status.remove();
      console.log("FallZone Unity instance loaded successfully.");
    }).catch(error => {
      status.textContent = "Failed to load FallZone: " + error;
      console.error("FallZone loading error:", error);
    });
  </script>
</body>
</html>
