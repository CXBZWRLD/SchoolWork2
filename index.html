<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIGTOE</title>
<style>
:root{--purple:#a72cff;--blue:#6ea8ff;--ink:#050714;--glass:rgba(6,8,25,.78);--line:rgba(156,83,255,.52);--muted:#aeb4d0}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#03050d url("assets/bigtoe-bg.png") center top/cover fixed no-repeat}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 50% 0,rgba(60,70,255,.15),transparent 42%),linear-gradient(to bottom,rgba(1,3,12,.08),rgba(1,2,10,.62))}
.shell{width:min(1220px,92%);margin:auto;padding:42px 0 70px}
.brand{text-align:center;margin:6px 0 24px}.crown{font-size:34px;color:#c54cff;filter:drop-shadow(0 0 12px #9b26ff);line-height:1}.brand h1{margin:0;font-size:clamp(54px,9vw,105px);font-style:italic;font-weight:1000;letter-spacing:-7px;line-height:.95;background:linear-gradient(180deg,#d8efff 0,#7eb8ff 25%,#b64cff 62%,#ff48df 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 15px rgba(133,56,255,.7));transform:skew(-5deg)}
.top-actions{position:fixed;right:26px;top:24px;z-index:5;display:flex;gap:4px;padding:6px;border:1px solid var(--line);background:rgba(4,6,20,.82);border-radius:18px;box-shadow:0 0 24px rgba(140,35,255,.25);backdrop-filter:blur(14px)}
.icon-btn{width:42px;height:38px;border:0;background:transparent;color:#eee;border-radius:12px;font-size:18px;cursor:pointer}.icon-btn:hover{background:rgba(174,64,255,.18)}
.search{max-width:700px;margin:0 auto 24px;position:relative}.search input{width:100%;height:58px;border-radius:28px;border:1px solid #8844db;background:rgba(3,5,17,.82);box-shadow:0 0 20px rgba(136,44,255,.3),inset 0 0 20px rgba(40,30,90,.18);color:white;font-size:17px;padding:0 24px 0 55px;outline:none;backdrop-filter:blur(12px)}.search input:focus{border-color:#c44cff;box-shadow:0 0 26px rgba(176,54,255,.48)}.search span{position:absolute;left:22px;top:14px;font-size:25px;color:#fff}
.panel{padding:13px;border:1px solid rgba(113,64,211,.42);border-radius:18px;background:linear-gradient(180deg,rgba(5,8,25,.77),rgba(7,5,22,.86));box-shadow:0 20px 60px rgba(0,0,0,.36);backdrop-filter:blur(16px)}
.filters{display:flex;gap:10px;overflow:auto;padding:0 0 13px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.filter{flex:0 0 auto;border:1px solid rgba(143,77,225,.55);background:rgba(8,10,28,.72);color:#d9daf0;padding:10px 19px;border-radius:22px;font-weight:650;cursor:pointer}.filter:hover,.filter.active{color:white;border-color:#d45bff;background:linear-gradient(135deg,#7738ff,#c837ff);box-shadow:0 0 16px rgba(176,53,255,.65)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.game-card{border:1px solid rgba(128,92,226,.62);background:linear-gradient(180deg,rgba(19,25,47,.94),rgba(6,7,22,.96));border-radius:14px;overflow:hidden;min-width:0;transition:.2s;cursor:pointer}.game-card:hover{transform:translateY(-4px);border-color:#b449ff;box-shadow:0 0 22px rgba(138,48,255,.26)}
.thumb{aspect-ratio:16/10;background:linear-gradient(135deg,#1d263d,#12172a);display:grid;place-items:center;color:#39425d;font-size:38px}.meta{padding:12px 13px 13px;position:relative}.meta h3{font-size:14px;margin:0 30px 5px 0}.meta p{font-size:12px;color:#9da5ce;margin:0}.heart{position:absolute;right:12px;top:12px;border:0;background:none;color:#d8dcff;font-size:20px;cursor:pointer}
.hint{text-align:center;color:#9298b7;font-size:12px;margin-top:15px}
@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}.top-actions{position:absolute}.brand h1{letter-spacing:-4px}}
@media(max-width:600px){.shell{padding-top:75px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.panel{padding:10px}.brand h1{font-size:58px}.crown{font-size:25px}.top-actions{right:4%;top:16px}}
</style>
</head>
<body>
<div class="top-actions"><button class="icon-btn" title="Discord" aria-label="Discord" type="button"><svg width="23" height="23" viewBox="0 0 127.14 96.36" fill="currentColor" aria-hidden="true"><path d="M104.4 8.48A101.7 101.7 0 0 0 79.1.6a70.1 70.1 0 0 0-3.24 6.65 94.1 94.1 0 0 0-28.57 0A70.1 70.1 0 0 0 44.05.6a101.7 101.7 0 0 0-25.3 7.88C2.75 32.2-1.6 55.34.56 78.15a102.6 102.6 0 0 0 31.06 15.73 74.2 74.2 0 0 0 6.66-10.84 66.1 66.1 0 0 1-10.48-5.06c.88-.64 1.74-1.3 2.57-1.98a72.8 72.8 0 0 0 63.9 0c.84.69 1.7 1.35 2.58 1.99a66.1 66.1 0 0 1-10.5 5.06 74.2 74.2 0 0 0 6.67 10.84 102.6 102.6 0 0 0 31.06-15.73c2.54-26.45-4.34-49.38-18.68-69.67ZM42.45 65.4c-6.08 0-11.08-5.6-11.08-12.47s4.9-12.47 11.08-12.47c6.24 0 11.18 5.65 11.08 12.47 0 6.87-4.9 12.47-11.08 12.47Zm42.24 0c-6.08 0-11.08-5.6-11.08-12.47s4.9-12.47 11.08-12.47c6.24 0 11.18 5.65 11.08 12.47 0 6.87-4.84 12.47-11.08 12.47Z"/></svg></button><button class="icon-btn" title="Games">🎮</button><button class="icon-btn" title="Settings">⚙</button></div>
<main class="shell">
<section class="brand"><div class="crown">♕</div><h1>BIGTOE</h1></section>
<div class="search"><span>⌕</span><input id="search" placeholder="Search games..." autocomplete="off"></div>
<section class="panel">
<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>
<div class="hint">Slope, Crazy Cattle 3D, Geometry Dash and Football Bros are live — the remaining cards are placeholders.</div>
</section>
</main>
<script>
const categories=["All","Action","Adventure","Racing","Sports","Puzzle","Strategy","Multiplayer"];
// Live game cards appear first; remaining cards are placeholders.
const games=[{title:"Slope",category:"Action",image:"assets/game-logos/slopegame.png",url:"games/slope/index.html"},{title:"Crazy Cattle 3D",category:"Action",image:"games/crazycattle3d/index.png",url:"games/crazycattle3d/index.html"},{title:"Geometry Dash",category:"Action",image:"games/geometrydash/splash.png",url:"games/geometrydash/index.html"},{title:"Football Bros",category:"Sports",image:"assets/game-logos/footballbros.png",url:"games/footballbros/index.html"},...Array.from({length:7},(_,i)=>({title:"Game Name",category:i%2?"Adventure":"Action",image:"",url:""}))];
let active="All";
const grid=document.querySelector("#grid"),filters=document.querySelector("#filters"),search=document.querySelector("#search");
function drawFilters(){filters.innerHTML=categories.map(c=>'<button class="filter '+(c===active?'active':'')+'" data-cat="'+c+'">'+c+'</button>').join("");filters.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{active=b.dataset.cat;drawFilters();render()})}
function render(){const q=search.value.toLowerCase().trim();let list=games.filter(g=>g.title.toLowerCase().includes(q)&&(active==="All"||g.category===active));grid.innerHTML=list.map((g,i)=>'<article class="game-card" data-game="'+i+'" data-url="'+(g.url||'')+'"><div class="thumb">'+(g.image?'<img src="'+g.image+'" alt="" style="width:100%;height:100%;object-fit:cover">':'▧')+'</div><div class="meta"><h3>'+g.title+'</h3><p>'+g.category+'</p></div></article>').join("");grid.querySelectorAll(".game-card").forEach(card=>card.onclick=()=>{const u=card.dataset.url;if(u)location.href=u})}
search.oninput=render;drawFilters();render();
</script>
</body>
</html>
