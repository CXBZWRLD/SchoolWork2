<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade</title>
<style>
:root{--bg:#080b12;--panel:#101520;--panel2:#171d2a;--text:#f7f8fb;--muted:#9aa4b5;--accent:#7c5cff;--border:rgba(255,255,255,.08)}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -20%,#222a49 0,transparent 38%),var(--bg);color:var(--text);min-height:100vh}
header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 6%;border-bottom:1px solid var(--border);background:rgba(8,11,18,.78);backdrop-filter:blur(18px);position:sticky;top:0;z-index:20}
.logo{font-weight:850;font-size:21px;letter-spacing:-.5px}.logo span{color:var(--accent)}
nav{display:flex;gap:24px}nav a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:650}nav a:hover{color:white}
main{width:min(1180px,90%);margin:auto;padding:70px 0}
.hero{text-align:center;max-width:720px;margin:0 auto 55px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#a997ff;font-weight:800}.hero h1{font-size:clamp(38px,7vw,68px);letter-spacing:-3px;line-height:1;margin:13px 0 16px}.hero p{color:var(--muted);font-size:17px;line-height:1.6;margin:0 auto 30px}
.search{max-width:600px;margin:auto;position:relative}.search input{width:100%;padding:17px 20px 17px 48px;border:1px solid var(--border);border-radius:16px;background:#111722;color:white;outline:none;font-size:15px;box-shadow:0 15px 50px rgba(0,0,0,.22)}.search input:focus{border-color:#6650d8}.search span{position:absolute;left:18px;top:16px;color:#778197}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.toolbar h2{font-size:23px;margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid var(--border);background:var(--panel);color:var(--muted);padding:9px 14px;border-radius:999px;cursor:pointer;font-weight:700}.filter.active,.filter:hover{background:var(--accent);color:white;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:18px}
.card{display:block;color:inherit;text-decoration:none;background:var(--panel);border:1px solid var(--border);border-radius:18px;overflow:hidden;transition:.22s ease}.card:hover{transform:translateY(-5px);border-color:rgba(124,92,255,.55);box-shadow:0 18px 45px rgba(0,0,0,.3)}
.thumb{aspect-ratio:16/10;background:linear-gradient(135deg,#252c3c,#151a25);display:grid;place-items:center;color:#687187;font-size:42px}.card-body{padding:15px}.card h3{font-size:16px;margin:0 0 6px}.card p{font-size:12px;color:var(--muted);margin:0;text-transform:uppercase;letter-spacing:.8px;font-weight:750}
.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--muted)}
footer{text-align:center;color:#606a7b;font-size:12px;padding:30px}
@media(max-width:650px){header{padding:0 5%}nav{display:none}main{padding-top:45px}.hero h1{letter-spacing:-2px}.toolbar{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.card-body{padding:12px}}
</style>
</head>
<body>
<header><div class="logo">Arcade<span>.</span></div><nav><a href="#">Home</a><a href="#games">Games</a></nav></header>
<main>
<section class="hero">
<div class="eyebrow">Game Library</div>
<h1>Pick a game.<br>Start playing.</h1>
<p>A fast, simple library for your browser games.</p>
<div class="search"><span>⌕</span><input id="search" type="search" placeholder="Search games..." autocomplete="off"></div>
</section>
<section id="games">
<div class="toolbar"><h2>All games</h2><div class="filters" id="filters"></div></div>
<div class="grid" id="grid"></div>
</section>
</main>
<footer>Built for the web.</footer>
<script>
// Add your own games here. Put each game in /games/game-name/ and point url to its index.html.
const games = [
  // Example:
  // { title: "My Game", category: "Action", image: "assets/thumbnails/my-game.png", url: "games/my-game/index.html" }
];

const grid=document.getElementById("grid"), search=document.getElementById("search"), filters=document.getElementById("filters");
let active="All";
const categories=["All",...new Set(games.map(g=>g.category))];

function drawFilters(){
 filters.innerHTML=categories.map(c=>`<button class="filter ${c===active?"active":""}" data-cat="${c}">${c}</button>`).join("");
 filters.querySelectorAll("button").forEach(b=>b.onclick=()=>{active=b.dataset.cat;drawFilters();render()});
}
function render(){
 const q=search.value.trim().toLowerCase();
 const list=games.filter(g=>(active==="All"||g.category===active)&&g.title.toLowerCase().includes(q));
 if(!list.length){grid.innerHTML='<div class="empty">No games added yet. Add your first game to the <strong>games</strong> array in index.html.</div>';return}
 grid.innerHTML=list.map(g=>`<a class="card" href="${g.url}"><div class="thumb">${g.image?`<img src="${g.image}" alt="" style="width:100%;height:100%;object-fit:cover">`:"🎮"}</div><div class="card-body"><h3>${g.title}</h3><p>${g.category}</p></div></a>`).join("");
}
search.addEventListener("input",render);drawFilters();render();
</script>
</body>
</html>
